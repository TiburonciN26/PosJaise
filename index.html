<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- El favicon.svg original era un rayo genérico (ni siquiera el logo
         real) — reemplazado por el logo real, generado a los tamaños que
         cada contexto necesita: favicon.ico como fallback clásico (algunos
         navegadores lo piden en /favicon.ico sin importar los <link> de
         acá), 16/32 para la pestaña en PC, y el apple-touch-icon a 512
         para cuando se agrega a la pantalla de inicio en iOS. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <!-- interactive-widget=resizes-visual (el default): al abrir el teclado
         SOLO se encoge el viewport visual, no el layout — así los elementos
         position:fixed con bottom:0 (el panel de cobro en Ventas) se quedan
         anclados al fondo físico de la pantalla y el teclado los tapa, en vez
         de "subir" por encima del teclado y tapar el resto de la pantalla al
         buscar un producto. (Con resizes-content el layout se encogía y el
         panel subía completo — no era lo que se quería.) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-visual"
    />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Bloqueante a propósito, antes que cualquier CSS/JS del bundle: sin
      // esto, la página pintaría un instante en oscuro (o claro) y recién
      // React, ya montado, corregiría al tema guardado — un parpadeo
      // visible. Misma clave/lógica que ThemeContext.jsx (temaInicial) —
      // si se cambia acá, cambiar también allá. Va después del <meta
      // theme-color> de arriba porque necesita que ya exista en el DOM.
      ;(function () {
        var guardado = localStorage.getItem('pos-jaise-tema')
        var tema =
          guardado === 'claro' || guardado === 'oscuro'
            ? guardado
            : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'claro'
              : 'oscuro'
        document.documentElement.dataset.tema = tema
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', tema === 'claro' ? '#f5f4f1' : '#0a0a0a')
      })()
    </script>
    <script>
      // Foto principal de Inicio (el elemento más grande de la página de aterrizaje). Sin esto el navegador la descubría recién
      // cuando React pintaba el hero: después de bajar el JS de entrada, resolver la sesión y bajar los chunks del portal. Con
      // el <link rel="preload"> empieza a bajar a la vez que ese JS. Solo en / o /inicio, y solo si esta visita va a montar el
      // portal: misma regla que precargaTemprana() en src/config/paginasCliente.js (sin sesión guardada, o pista «portal») y
      // mismo tema que TemaWebContext.jsx (clave jaise-tema-web) — si cambian allá, cambiar también acá. El <img> del hero pide
      // exactamente esta URL, así que reutiliza la descarga (no se baja dos veces).
      ;(function () {
        try {
          var base = '%BASE_URL%'
          var l = window.location
          // Ruta reenviada por public/404.html como «<base>?/inicio» (ver el script del <body>). Sin escribir la base de
          // GitHub Pages aquí: Vite deja este comentario en el index.html final y build-cloudflare.mjs rechaza cualquier
          // mención a esa ruta.
          var ruta = l.search.charAt(1) === '/' ? l.search.slice(1).split('&')[0] : l.pathname.slice(base.length - 1) || '/'
          if (!/^\/(inicio\/?)?$/.test(ruta)) return
          var haySesion = false
          for (var i = 0; i < localStorage.length; i++) {
            if (/^sb-.+-auth-token$/.test(localStorage.key(i) || '')) haySesion = true
          }
          if (haySesion && localStorage.getItem('jaise-arbol') !== 'portal') return
          var tema = localStorage.getItem('jaise-tema-web') === 'claro' ? 'claro' : 'oscuro'
          var enlace = document.createElement('link')
          enlace.rel = 'preload'
          enlace.as = 'image'
          enlace.type = 'image/webp'
          enlace.setAttribute('fetchpriority', 'high')
          // Pantalla chica: la variante de 1280 px (misma consulta que MEDIA_HERO_CHICO en InicioCliente.jsx).
          var chica = window.matchMedia('(max-width: 639px)').matches
          enlace.href = base + 'inicio-web/hero-despues-' + tema + (chica ? '-1280' : '') + '.webp'
          document.head.appendChild(enlace)
        } catch (e) {
          // Almacenamiento bloqueado: la foto se pide al pintar el hero, como antes.
        }
      })()
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pos Jaise Beauty Academy" />
    <!-- Tipografías (Space Mono, Inter, Instrument Serif, Orbitron): ya NO se piden a Google Fonts. Están alojadas en
         src/assets/fonts/google/ y declaradas en src/index.css (@font-face, mismos archivos, familias y pesos): sin conexiones a
         fonts.googleapis.com / fonts.gstatic.com. Para sumar una familia o un peso, ver el comentario de ese bloque. -->
    <!-- La del logo del header del portal (Orbitron) se precarga desde src/config/paginasCliente.js (precargarFuenteLogo), solo
         cuando la visita monta el portal: el POS no la usa y no la descarga. -->
    <title>Pos Jaise Beauty Academy</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Decodifica la ruta codificada por public/404.html y la restaura con
      // history.replaceState antes de que React Router monte — ver ese
      // archivo para el porqué (fallback de SPA en GitHub Pages).
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
