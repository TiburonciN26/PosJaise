name: Desplegar a GitHub Pages

# A1 de la auditoría técnica: build automático a cada push a main, publicado
# gratis en GitHub Pages (repo público). El anon key de Supabase va en el
# bundle a propósito — es la clave pensada para el navegador, la seguridad
# real la da RLS en la base de datos, no ocultar esta clave.
#
# Fase 10B (transición a Cloudflare Pages): SOLO MANUAL. El push a main del lanzamiento NO debe redesplegar GitHub Pages:
# github.io conserva el build anterior (main 0dc629e, deployment 6922311389, index.html SHA-256 9ade57fe…, bundle
# assets/index-BYFcUGaT.js) durante la transición y como reversión del frontend. Republicar aquí solo con decisión expresa
# (p. ej. el build de redirección de la retirada de github.io). Para volver a publicar el build anterior desde este workflow,
# ejecutarlo a mano sobre una ref de 0dc629e (su versión del workflow conserva workflow_dispatch).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
