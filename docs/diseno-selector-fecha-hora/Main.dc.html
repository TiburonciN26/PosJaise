<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Fecha y hora — escritorio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Space+Mono:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#f5a623}a:hover{color:#ffc35c}
.dia{background:transparent}
.dia:hover:not(:disabled){background:#1c1c1c}
.chip{background:#101010}
.chip:hover{background:#1c1c1c}
.icono-btn{background:transparent}
.icono-btn:hover:not(:disabled){background:#1c1c1c}
.campo-fecha:hover{border-color:#363636}
</style>
</helmet>
<div style="width: 1000px; height: 780px; box-sizing: border-box; background: #0a0a0a; font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; color: #ffffff; display: flex; justify-content: center; padding-top: 40px;">
  <div style="width: 680px; height: 700px; box-sizing: border-box; background: #141414; border: 1px solid #2a2a2a; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 18px; position: relative;">

    <div style="display: flex; align-items: center; justify-content: space-between;">
      <h2 style="margin: 0; font-size: 20px; font-weight: 700;">Nueva cita</h2>
      <button type="button" class="icono-btn" aria-label="Cerrar" style="width: 36px; height: 36px; border: 0; border-radius: 8px; color: #ffffff; cursor: pointer; display: flex; align-items: center; justify-content: center;">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="clienta" style="font-size: 14px; font-weight: 500;">Clienta <span style="color: #f06565;">*</span></label>
      <input id="clienta" placeholder="Buscar clienta…" style="height: 42px; box-sizing: border-box; border-radius: 8px; border: 1px solid #2a2a2a; background: #141414; color: #ffffff; padding: 0 12px; font: inherit; font-size: 14px;">
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px; position: relative; z-index: 2;">
      <span id="lbl-fecha" style="font-size: 14px; font-weight: 500;">Fecha y hora <span style="color: #f06565;">*</span></span>
      <button type="button" class="campo-fecha" aria-labelledby="lbl-fecha" aria-expanded="{{abiertoTxt}}" onClick="{{alternar}}" style="{{estiloCampo}}">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f5a623" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2.5"></rect><path d="M3 9.5h18M8 2.5v4M16 2.5v4"></path></svg>
        <span style="flex: 1 1 auto; text-align: left; font-size: 15px; font-weight: 500;">{{resumenFecha}}</span>
        <span style="display: flex; align-items: center; gap: 6px; font-family: 'Space Mono', monospace; font-size: 14px; color: #f5a623;">
          <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
          {{resumenHora}}
        </span>
        <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" style="{{estiloCaret}}"><path d="M3 8h18l-9 10z" fill="#ffffff"></path></svg>
      </button>

      <sc-if value="{{abierto}}" hint-placeholder-val="{{ true }}">
        <div role="dialog" aria-label="Elegir fecha y hora" style="position: absolute; top: 76px; left: 0; right: 0; box-sizing: border-box; background: #141414; border: 1px solid #363636; border-radius: 14px; box-shadow: 0 18px 50px rgba(0,0,0,0.6); padding: 16px; display: flex; gap: 16px;">

          <div style="flex: 0 0 266px; display: flex; flex-direction: column; gap: 8px;">
            <div style="display: flex; align-items: center; gap: 4px;">
              <button type="button" class="icono-btn" aria-label="Mes anterior" disabled="{{sinAnterior}}" onClick="{{mesAnterior}}" style="{{estiloAnterior}}">
                <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
              </button>
              <span style="flex: 1 1 auto; text-align: center; font-size: 15px; font-weight: 600;">{{tituloMes}}</span>
              <button type="button" class="icono-btn" aria-label="Mes siguiente" onClick="{{mesSiguiente}}" style="width: 34px; height: 34px; border: 0; border-radius: 8px; color: #ffffff; cursor: pointer; display: flex; align-items: center; justify-content: center;">
                <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
              </button>
            </div>
            <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; text-align: center; font-size: 12px; color: rgba(255,255,255,0.6); font-weight: 600;">
              <abbr title="lunes" style="text-decoration: none;">L</abbr>
              <abbr title="martes" style="text-decoration: none;">M</abbr>
              <abbr title="miércoles" style="text-decoration: none;">M</abbr>
              <abbr title="jueves" style="text-decoration: none;">J</abbr>
              <abbr title="viernes" style="text-decoration: none;">V</abbr>
              <abbr title="sábado" style="text-decoration: none;">S</abbr>
              <abbr title="domingo" style="text-decoration: none;">D</abbr>
            </div>
            <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px;">
              <sc-for list="{{celdas}}" as="c" hint-placeholder-count="35">
                <sc-if value="{{c.vacia}}" hint-placeholder-val="{{ false }}">
                  <span aria-hidden="true" style="height: 36px;"></span>
                </sc-if>
                <sc-if value="{{c.esDia}}" hint-placeholder-val="{{ true }}">
                  <button type="button" class="dia" aria-label="{{c.aria}}" aria-pressed="{{c.pressed}}" disabled="{{c.pasado}}" onClick="{{c.pick}}" style="{{c.estilo}}">{{c.num}}</button>
                </sc-if>
              </sc-for>
            </div>
            <button type="button" onClick="{{irHoy}}" style="align-self: flex-start; margin-top: 2px; border: 0; background: transparent; color: #f5a623; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; padding: 6px 4px;">Ir a hoy</button>
          </div>

          <div aria-hidden="true" style="width: 1px; background: #2a2a2a;"></div>

          <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 10px;">
            <div style="display: flex; flex-direction: column; gap: 2px;">
              <span style="font-size: 12px; color: rgba(255,255,255,0.6); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;">Horario</span>
              <span style="font-size: 15px; font-weight: 600;">{{diaCorto}}</span>
            </div>
            <div style="display: flex; flex-direction: column; gap: 12px;">
              <sc-for list="{{grupos}}" as="g" hint-placeholder-count="3">
                <div style="display: flex; flex-direction: column; gap: 6px;">
                  <span style="font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.6);">{{g.titulo}} <span style="color: #f5a623;">· {{g.sub}}</span></span>
                  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px;">
                    <sc-for list="{{g.items}}" as="s" hint-placeholder-count="6">
                      <button type="button" class="chip" aria-label="{{s.aria}}" aria-pressed="{{s.pressed}}" onClick="{{s.pick}}" style="{{s.estilo}}">{{s.hora}}</button>
                    </sc-for>
                  </div>
                </div>
              </sc-for>
            </div>
          </div>
        </div>
      </sc-if>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="adelanto" style="font-size: 14px; font-weight: 500;">Adelanto o abono</label>
      <input id="adelanto" placeholder="S/ Opcional" style="height: 42px; box-sizing: border-box; border-radius: 8px; border: 1px solid #2a2a2a; background: #141414; color: #ffffff; padding: 0 12px; font: inherit; font-size: 14px;">
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <label for="nota" style="font-size: 14px; font-weight: 500;">Nota</label>
      <textarea id="nota" placeholder="Opcional" style="height: 84px; box-sizing: border-box; border-radius: 8px; border: 1px solid #2a2a2a; background: #141414; color: #ffffff; padding: 10px 12px; font: inherit; font-size: 14px; resize: none;"></textarea>
    </div>

    <div style="margin-top: auto; display: flex; justify-content: flex-end; gap: 10px;">
      <button type="button" style="height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid #2a2a2a; background: transparent; color: #ffffff; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;">Cancelar</button>
      <button type="button" style="height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: #f5a623; color: #0a0a0a; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer;">Guardar cita</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1000,"height":780}}'>
var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var MESES_CORTO = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
var DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
var DIAS_CORTO = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
var HOY = new Date(2026, 10, 22);
var INICIO = 9 * 60;
var FIN = 19 * 60 + 30;
var PASO = 30;

function mayus(t) { return t.charAt(0).toUpperCase() + t.slice(1); }
function partirHora(min) {
  var h = Math.floor(min / 60);
  var m = min % 60;
  var h12 = ((h + 11) % 12) + 1;
  return { hora: h12 + ':' + (m < 10 ? '0' + m : m), ampm: h < 12 ? 'a. m.' : 'p. m.' };
}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { verA: 2026, verM: 10, selA: 2026, selM: 10, selD: 22, slot: 9 * 60, abierto: true };
  }

  renderVals() {
    var self = this;
    var s = this.state;
    var primero = new Date(s.verA, s.verM, 1);
    var desfase = (primero.getDay() + 6) % 7;
    var diasMes = new Date(s.verA, s.verM + 1, 0).getDate();
    var base = 'height: 36px; border-radius: 8px; border: 1px solid transparent; font: inherit; font-size: 14px; color: #ffffff; cursor: pointer; padding: 0;';

    var celdas = [];
    for (var i = 0; i < desfase; i++) celdas.push({ vacia: true, esDia: false });
    for (var d = 1; d <= diasMes; d++) {
      (function (d) {
        var f = new Date(s.verA, s.verM, d);
        var pasado = f.getTime() < HOY.getTime();
        var esHoy = f.getTime() === HOY.getTime();
        var elegido = s.selA === s.verA && s.selM === s.verM && s.selD === d;
        var estilo = base;
        if (elegido) estilo += ' background: #f5a623; color: #0a0a0a; font-weight: 700;';
        else if (esHoy) estilo += ' border-color: #f5a623; color: #f5a623; font-weight: 700;';
        else if (pasado) estilo += ' color: rgba(255,255,255,0.25); cursor: default;';
        celdas.push({
          vacia: false, esDia: true, num: d, pasado: pasado, estilo: estilo,
          pressed: elegido ? 'true' : 'false',
          aria: DIAS[f.getDay()] + ' ' + d + ' de ' + MESES[s.verM] + (esHoy ? ' (hoy)' : ''),
          pick: function () { self.setState({ selA: s.verA, selM: s.verM, selD: d }); }
        });
      })(d);
    }

    var grupos = [
      { titulo: 'Mañana', sub: 'a. m.', items: [] },
      { titulo: 'Tarde', sub: 'p. m.', items: [] },
      { titulo: 'Noche', sub: 'p. m.', items: [] }
    ];
    for (var min = INICIO; min <= FIN; min += PASO) {
      (function (min) {
        var p = partirHora(min);
        var elegido = s.slot === min;
        var g = min < 12 * 60 ? 0 : (min < 18 * 60 ? 1 : 2);
        var estilo = 'height: 34px; border-radius: 8px; font-family: \'Space Mono\', monospace; font-size: 14px; cursor: pointer; padding: 0;';
        estilo += elegido ? ' background: #f5a623; border: 1px solid #f5a623; color: #0a0a0a; font-weight: 700;' : ' border: 1px solid #2a2a2a; color: #ffffff;';
        grupos[g].items.push({
          hora: p.hora, estilo: estilo, pressed: elegido ? 'true' : 'false',
          aria: p.hora + ' ' + p.ampm,
          pick: function () { self.setState({ slot: min, abierto: false }); }
        });
      })(min);
    }

    var fSel = new Date(s.selA, s.selM, s.selD);
    var hSel = partirHora(s.slot);
    var esMesHoy = s.verA === HOY.getFullYear() && s.verM === HOY.getMonth();

    return {
      celdas: celdas,
      grupos: grupos,
      abierto: s.abierto,
      abiertoTxt: s.abierto ? 'true' : 'false',
      tituloMes: mayus(MESES[s.verM]) + ' ' + s.verA,
      diaCorto: DIAS_CORTO[fSel.getDay()] + ' ' + s.selD + ' ' + MESES_CORTO[s.selM],
      resumenFecha: mayus(DIAS[fSel.getDay()]) + ' ' + s.selD + ' de ' + MESES[s.selM] + ' ' + s.selA,
      resumenHora: hSel.hora + ' ' + hSel.ampm,
      sinAnterior: esMesHoy,
      estiloAnterior: 'width: 34px; height: 34px; border: 0; border-radius: 8px; display: flex; align-items: center; justify-content: center; ' + (esMesHoy ? 'color: rgba(255,255,255,0.25); cursor: default;' : 'color: #ffffff; cursor: pointer;'),
      estiloCampo: 'height: 48px; width: 100%; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-radius: 10px; background: #141414; color: #ffffff; font: inherit; cursor: pointer; border: 1px solid ' + (s.abierto ? '#f5a623' : '#2a2a2a') + ';',
      estiloCaret: 'transition: transform 200ms ease; transform: rotate(' + (s.abierto ? '180deg' : '0deg') + ');',
      alternar: function () { self.setState({ abierto: !s.abierto }); },
      mesAnterior: function () {
        if (esMesHoy) return;
        var m = s.verM - 1, a = s.verA;
        if (m < 0) { m = 11; a -= 1; }
        self.setState({ verA: a, verM: m });
      },
      mesSiguiente: function () {
        var m = s.verM + 1, a = s.verA;
        if (m > 11) { m = 0; a += 1; }
        self.setState({ verA: a, verM: m });
      },
      irHoy: function () {
        self.setState({ verA: HOY.getFullYear(), verM: HOY.getMonth(), selA: HOY.getFullYear(), selM: HOY.getMonth(), selD: HOY.getDate() });
      }
    };
  }
}
</script>
</body>
</html>
